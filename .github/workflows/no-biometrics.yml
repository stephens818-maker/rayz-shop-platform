# ST-I17: no face, fingerprint, voice or ID-verification SDKs (Illinois BIPA). The Ray'z Staff and
# client app repos run the same script from this repo; see NOTES-SYNC.md.
name: No biometrics
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  no-biometrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-no-biometrics.mjs
